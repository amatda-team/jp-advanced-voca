<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>日本語 深掘り単語帳</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  /* 웜 다크 테마 */
  :root {
    --bg-color: #1E1E24;
    --card-bg: #2B2B36;
    --text-main: #E8EAED;
    --text-sub: #9AA0A6;
    --accent-mint: #57C7A3;
    --accent-coral: #F28B82;
  }

  body { 
    background-color: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; 
    margin: 0; padding: 0; color: var(--text-main); -webkit-tap-highlight-color: transparent; 
  }

  /* --- 대시보드 (홈 화면) --- */
  #dashboard-view {
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)) 20px;
    animation: fadeIn 0.3s ease;
  }
  .dash-header { margin-bottom: 32px; text-align: center; }
  .dash-title { font-size: 24px; font-weight: 800; color: var(--text-main); margin: 0 0 8px 0; }
  .dash-progress-text { font-size: 14px; color: var(--text-sub); font-weight: 600; }

  .day-list { display: flex; flex-direction: column; gap: 12px; }
  .day-row {
    background: var(--card-bg); padding: 22px 20px; border-radius: 16px;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .day-row:active { transform: scale(0.98); background: #32323D; }
  
  .day-info { flex: 1; margin-right: 16px; }
  .day-title-area { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .day-title { font-size: 18px; font-weight: 800; color: var(--text-main); }
  
  .day-status { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; }
  .status-new { background: rgba(154, 160, 166, 0.15); color: var(--text-sub); }
  .status-ing { background: rgba(87, 199, 163, 0.15); color: var(--accent-mint); } 
  .status-done { background: rgba(253, 203, 110, 0.15); color: #FDCB6E; border: 1px solid rgba(253, 203, 110, 0.3); }

  .day-progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 4px; margin-bottom: 8px; overflow: hidden; }
  .day-progress-bar-fill { height: 100%; background: var(--accent-mint); transition: width 0.3s ease; }
  .day-stats { font-size: 13px; color: var(--text-sub); font-weight: 600; }
  .day-icon { color: var(--text-sub); font-weight: bold; }

  /* --- 학습 뷰 --- */
  #study-view {
    display: none; flex-direction: column; align-items: center;
    padding: calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    min-height: 100dvh; box-sizing: border-box;
    animation: fadeIn 0.3s ease;
  }

  .study-header {
    width: 100%; max-width: 400px; display: flex; align-items: center; justify-content: center;
    position: relative; flex-shrink: 0;
  }
  .study-header-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .study-title { font-size: 18px; font-weight: 800; color: var(--text-main); line-height: 1; }
  
  .study-progress-bg { width: 120px; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .study-progress-fill { height: 100%; background: var(--accent-mint); width: 0%; transition: width 0.4s ease; }

  .back-btn {
    position: absolute; left: 0; background: none; border: none; font-size: 16px; font-weight: 600; 
    color: var(--text-sub); cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 8px 0;
    top: 50%; transform: translateY(-50%); 
  }

  /* 메인 학습 콘텐츠 영역 (레이아웃 흔들림 방지 고정 뼈대) */
  .learning-container {
    width: 100%; max-width: 400px; display: flex; flex-direction: column; 
    flex: 1; justify-content: center; 
    padding: 10px 0; 
  }
  
  /* 한자 영역 고정 높이 */
  .word-display {
    height: 80px; display: flex; justify-content: center; align-items: center;
    font-size: 64px; font-weight: 500; color: var(--text-main); 
    margin-bottom: 8px; text-align: center;
  }
  /* 뜻 영역 고정 높이 */
  .word-meaning {
    height: 36px; display: flex; justify-content: center; align-items: center;
    font-size: 26px; font-weight: 700; color: var(--accent-mint);
    margin-bottom: 24px; opacity: 0; transition: opacity 0.2s ease;
  }

  /* 예문 박스 고정 높이 (내부 텍스트는 세로 중앙 정렬) */
  .sentence-box {
    background: var(--card-bg); border-radius: 20px; padding: 0 20px;
    height: 160px; /* 고정 높이로 흔들림 차단 */
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; border: 1px solid rgba(255,255,255,0.03);
  }
  .sentence-ja {
    font-size: 22px; line-height: 2.2; font-weight: 500; color: var(--text-main);
    word-break: keep-all; margin-bottom: 12px;
  }
  .sentence-ko {
    font-size: 18px; color: var(--text-sub); line-height: 1.5;
    opacity: 0; transition: opacity 0.2s ease; word-break: keep-all;
  }

  /* 루비(요미가나) 숨김/보임 제어 */
  rt { 
    opacity: 0; transition: opacity 0.2s ease; 
    color: var(--accent-mint); font-size: 12px; font-weight: 700; 
  }
  
  .show-ruby rt { opacity: 1; }
  .show-meaning .word-meaning, .show-meaning .sentence-ko { opacity: 1; }

  /* 하단 고정 컨트롤 영역 */
  .bottom-controls {
    width: 100%; max-width: 400px; 
    margin-top: auto; 
    display: flex; flex-direction: column; gap: 16px;
    flex-shrink: 0;
  }

  /* 토글 버튼 (잔잔하고 부드러운 느낌으로 변경) */
  .toggle-area { display: flex; gap: 12px; width: 100%; }
  .toggle-btn {
    flex: 1; padding: 18px 0; background: rgba(255,255,255,0.04); border-radius: 14px;
    color: var(--text-sub); font-size: 16px; font-weight: 600; border: none;
    cursor: pointer; transition: all 0.2s ease;
  }
  /* 활성화 시 부드러운 색상 변화 (테두리 없음) */
  .toggle-btn.active {
    background: rgba(255,255,255,0.08); color: #E8EAED;
  }

  .action-area { display: flex; gap: 16px; width: 100%; }
  .action-btn { 
    flex: 1; padding: 24px 0; border-radius: 20px; font-size: 20px; font-weight: 800; cursor: pointer; 
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.1s ease-out; touch-action: manipulation; user-select: none; 
  }
  .btn-no { background: transparent; color: var(--accent-coral); border: 2px solid var(--accent-coral); }
  .btn-yes { background: transparent; color: var(--accent-mint); border: 2px solid var(--accent-mint); }
  
  .btn-no:active, .btn-no.pressed { background: var(--accent-coral); color: var(--bg-color); transform: scale(0.95); }
  .btn-yes:active, .btn-yes.pressed { background: var(--accent-mint); color: var(--bg-color); transform: scale(0.95); }

  /* --- 커스텀 알럿 --- */
  .custom-alert-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7); z-index: 9999; 
    align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(4px);
  }
  .custom-alert-box {
    background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
    padding: 30px 24px; text-align: center; max-width: 300px; width: 100%;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .custom-alert-icon { font-size: 40px; margin-bottom: 12px; }
  .custom-alert-msg { font-size: 16px; font-weight: 700; color: var(--text-main); line-height: 1.6; margin-bottom: 24px; white-space: pre-wrap; }
  .custom-alert-btn {
    width: 100%; background: var(--accent-mint); border: none; border-radius: 12px;
    padding: 16px 0; font-size: 16px; font-weight: 800; color: var(--bg-color); cursor: pointer;
  }
  
  @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="dashboard-view">
  <div class="dash-header">
    <h1 class="dash-title">深掘り単語帳</h1>
    <div class="dash-progress-text" id="uiGlobalProgress">総単語数: 0</div>
  </div>
  <div class="day-list" id="uiDayList"></div>
</div>

<div id="study-view">
  <div class="study-header">
    <button class="back-btn" onclick="goHome()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      戻る
    </button>
    <div class="study-header-center">
      <div class="study-title" id="uiStudyTitle">Day 1</div>
      <div class="study-progress-bg">
        <div class="study-progress-fill" id="uiStudyProgress"></div>
      </div>
    </div>
  </div>

  <div class="learning-container" id="learningContainer">
    <div class="word-display" id="uiWord">単語</div>
    <div class="word-meaning" id="uiMeaning">뜻</div>
    
    <div class="sentence-box">
      <div class="sentence-ja" id="uiExJa">例文</div>
      <div class="sentence-ko" id="uiExKo">예문 해석</div>
    </div>
  </div>

  <div class="bottom-controls">
    <div class="toggle-area">
      <button class="toggle-btn" id="btn-meaning" onclick="toggleMeaning()">💡 意味</button>
      <button class="toggle-btn" id="btn-ruby" onclick="toggleRuby()">🗣️ ふりがな</button>
    </div>
    
    <div class="action-area">
      <button class="action-btn btn-no" onclick="mark(false)">🤔 分からない</button>
      <button class="action-btn btn-yes" onclick="mark(true)">✅ 分かる</button>
    </div>
  </div>
</div>

<div class="custom-alert-overlay" id="customAlertOverlay">
  <div class="custom-alert-box">
    <div class="custom-alert-icon" id="customAlertIcon">🎉</div>
    <div class="custom-alert-msg" id="customAlertMsg">メッセージ</div>
    <button class="custom-alert-btn" id="customAlertBtn">確認</button>
  </div>
</div>

<script src="data.js"></script>
<script>
  const WORDS_PER_DAY = 30; 
  
  let sessionWords = [];
  let currentCard = null;
  let currentMode = ""; 
  let currentSessionTotal = 0; 
  
  let userStats = JSON.parse(localStorage.getItem('jpAdvancedStats')) || {};
  let isRubyOn = false;
  let isMeaningOn = false;

  function showCustomAlert(icon, message, btnText, callback) {
    document.getElementById('customAlertIcon').innerText = icon;
    document.getElementById('customAlertMsg').innerHTML = message; 
    document.getElementById('customAlertBtn').innerText = btnText;
    document.getElementById('customAlertOverlay').style.display = 'flex';
    document.getElementById('customAlertBtn').onclick = function() {
      document.getElementById('customAlertOverlay').style.display = 'none';
      if(callback) callback();
    };
  }

  function init() { renderDashboard(); }

  function renderDashboard() {
    const totalCount = db.length;
    document.getElementById('uiGlobalProgress').innerText = `総単語数: ${totalCount}個`;
    
    const dayListContainer = document.getElementById('uiDayList');
    dayListContainer.innerHTML = '';
    
    const totalDays = Math.ceil(totalCount / WORDS_PER_DAY);
    for(let i=1; i<=totalDays; i++) {
      const dayKey = `Day ${i}`;
      const stat = userStats[dayKey] || { completions: 0, cleared: [] };
      const completions = stat.completions || 0;
      const clearedCount = stat.cleared ? stat.cleared.length : 0;
      
      const startIndex = (i - 1) * WORDS_PER_DAY;
      const chunkLength = db.slice(startIndex, startIndex + WORDS_PER_DAY).length;
      const percent = Math.round((clearedCount / chunkLength) * 100);

      let statusBadge = '';
      if (completions > 0) statusBadge = `<span class="day-status status-done">🔥 ${completions}回読</span>`;
      else if (percent > 0) statusBadge = `<span class="day-status status-ing">進行中</span>`;
      else statusBadge = `<span class="day-status status-new">未学習</span>`;

      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <div class="day-info">
          <div class="day-title-area"><span class="day-title">Day ${i}</span>${statusBadge}</div>
          <div class="day-progress-bar-bg"><div class="day-progress-bar-fill" style="width: ${percent}%"></div></div>
          <div class="day-stats">${clearedCount} / ${chunkLength} 完了 (${percent}%)</div>
        </div>
        <span class="day-icon">〉</span>
      `;
      row.onclick = () => startStudy(`Day ${i}`);
      dayListContainer.appendChild(row);
    }
  }

  function startStudy(mode) {
    currentMode = mode;
    document.getElementById('uiStudyTitle').innerText = mode;

    const dayNum = parseInt(mode.replace("Day ", ""));
    const startIndex = (dayNum - 1) * WORDS_PER_DAY;
    const chunk = db.slice(startIndex, startIndex + WORDS_PER_DAY);
    
    currentSessionTotal = chunk.length; 
    let clearedList = userStats[mode] && userStats[mode].cleared ? userStats[mode].cleared : [];
    
    sessionWords = chunk.filter(w => !clearedList.includes(w.id)).sort(() => 0.5 - Math.random());

    document.getElementById('dashboard-view').style.display = 'none';
    document.getElementById('study-view').style.display = 'flex';
    loadNextCard();
  }

  function goHome() {
    document.getElementById('study-view').style.display = 'none';
    document.getElementById('dashboard-view').style.display = 'block';
    renderDashboard(); 
  }

  function loadNextCard() {
    let cleared = currentSessionTotal - sessionWords.length;
    let percent = currentSessionTotal > 0 ? Math.round((cleared / currentSessionTotal) * 100) : 100;
    document.getElementById('uiStudyProgress').style.width = percent + '%';

    if(sessionWords.length === 0) {
       if(!userStats[currentMode]) userStats[currentMode] = { completions: 0, cleared: [] };
       userStats[currentMode].completions++;
       userStats[currentMode].cleared = []; 
       saveStats();
       showCustomAlert("🎉", `${currentMode} 学習完了！\n(現在 🔥${userStats[currentMode].completions}回読 達成)`, "ホームに戻る", goHome);
       return;
    }
    
    currentCard = sessionWords[0];
    
    const wordHtml = currentCard.word.includes('<ruby>') ? currentCard.word : `<ruby>${currentCard.word}<rt>${currentCard.reading}</rt></ruby>`;
    document.getElementById('uiWord').innerHTML = wordHtml;
    
    document.getElementById('uiMeaning').innerText = currentCard.meaning;
    document.getElementById('uiExJa').innerHTML = currentCard.exJa !== "-" ? currentCard.exJa : "例文がありません。";
    document.getElementById('uiExKo').innerText = currentCard.exKo !== "-" ? currentCard.exKo : "-";
    
    isRubyOn = false;
    isMeaningOn = false;
    updateToggles();
  }

  function toggleRuby() { isRubyOn = !isRubyOn; updateToggles(); }
  function toggleMeaning() { isMeaningOn = !isMeaningOn; updateToggles(); }

  function updateToggles() {
    const container = document.getElementById('learningContainer');
    const btnRuby = document.getElementById('btn-ruby');
    const btnMean = document.getElementById('btn-meaning');

    if(isRubyOn) { container.classList.add('show-ruby'); btnRuby.classList.add('active'); }
    else { container.classList.remove('show-ruby'); btnRuby.classList.remove('active'); }

    if(isMeaningOn) { container.classList.add('show-meaning'); btnMean.classList.add('active'); }
    else { container.classList.remove('show-meaning'); btnMean.classList.remove('active'); }
  }

  function mark(isKnown) {
    const btn = isKnown ? document.querySelector('.btn-yes') : document.querySelector('.btn-no');
    btn.classList.add('pressed');
    
    setTimeout(() => { btn.classList.remove('pressed'); }, 100);

    setTimeout(() => {
      const card = sessionWords.shift();
      if(isKnown) {
        if (!userStats[currentMode]) userStats[currentMode] = { completions: 0, cleared: [] };
        if (!userStats[currentMode].cleared) userStats[currentMode].cleared = [];
        userStats[currentMode].cleared.push(card.id); 
      } else {
        sessionWords.push(card);
      }
      saveStats();
      loadNextCard();
    }, 100);
  }

  function saveStats() { localStorage.setItem('jpAdvancedStats', JSON.stringify(userStats)); }

  init();
</script>

</body>
</html>
